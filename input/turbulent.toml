[space]
xmin = 0.0
xmax = 2.0
ymin = 0.0
ymax = 1.0
hx = 0.01
hy = 0.01

[time]
t0 = 0.0
tfinal = 30.0
dt = 0.0005   # Pas de temps réduit car ça bouge vite !
scheme = "ExplicitEuler"

[physics]
rho = 1.0
nu = 0.0002   # Très fluide (Re élevé)

[obstacle]
cx = 0.5
cy = 0.51
radius = 0.06

[boundary]
left = "Dirichlet"
left_val = 1.0
inlet_profile = "Constant"
right = "Neumann"
bottom = "Neumann"
top = "Neumann"

[output]
results = "results/Turbulent"
name = "Regime_Chaotique"